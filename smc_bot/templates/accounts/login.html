{% extends "base.html" %}
{% block title %}Connexion - SMC RSI BOOM & CRASH 1000 PRO{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-20">
    <h1 class="text-xl font-bold text-center mb-6">Connexion</h1>
    <form method="post" class="bg-gray-900 border border-gray-800 rounded-lg p-6 space-y-4">
        {% csrf_token %}
        {% if form.errors %}
        <div class="text-rose-400 text-sm">Identifiants invalides.</div>
        {% endif %}
        <div>
            <label class="block text-xs text-gray-500 mb-1">Nom d'utilisateur</label>
            <input type="text" name="username" required autofocus
                   class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-xs text-gray-500 mb-1">Mot de passe</label>
            <input type="password" name="password" required
                   class="w-full bg-gray-950 border border-gray-800 rounded px-3 py-2 text-sm">
        </div>
        <button type="submit"
                class="w-full py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-sm font-medium">
            Se connecter
        </button>
    </form>
</div>
{% endblock %}
