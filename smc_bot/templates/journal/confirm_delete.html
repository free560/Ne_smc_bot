{% extends "base.html" %}
{% block title %}Supprimer le trade{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center mt-12">
    <h1 class="text-xl font-bold mb-4">Supprimer ce trade ?</h1>
    <p class="text-gray-500 mb-6">{{ entry.instrument }} {{ entry.direction }} du {{ entry.opened_at|date:"d/m/Y" }} — cette action est irréversible.</p>
    <form method="post" class="flex gap-3 justify-center">
        {% csrf_token %}
        <a href="{% url 'journal:list' %}" class="px-4 py-2 rounded bg-gray-800 text-sm">Annuler</a>
        <button type="submit" class="px-4 py-2 rounded bg-rose-600 hover:bg-rose-500 text-sm font-medium">Supprimer</button>
    </form>
</div>
{% endblock %}
