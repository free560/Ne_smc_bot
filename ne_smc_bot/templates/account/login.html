{% extends "base.html" %}
{% load socialaccount %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="flex items-center justify-center px-4 py-8 mb-20 md:mb-0">
    <div class="bg-panel border border-gray-700 shadow-lg rounded-xl p-8 max-w-md w-full">

        <h1 class="text-2xl font-bold mb-6 text-center">Connexion</h1>

        {% if form.errors %}
            <div class="bg-red-900 text-red-200 px-4 py-3 rounded mb-4 text-center">
                Email ou mot de passe incorrect.
            </div>
        {% endif %}

        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}

            <label for="id_login" class="block text-sm text-gray-400 mb-1">Email</label>
            <input type="email" name="login" id="id_login" required
                class="bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded w-full mb-4">

            <label for="id_password" class="block text-sm text-gray-400 mb-1">Mot de passe</label>
            <input type="password" name="password" id="id_password" required
                class="bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded w-full mb-4">

            <button type="submit"
                class="w-full bg-accent text-black font-semibold py-3 rounded-lg hover:opacity-90 transition">
                Se connecter
            </button>
        </form>

        <hr class="my-6 border-gray-700">

        <a href="{% provider_login_url 'google' %}" class="block">
            <button type="button"
                class="w-full bg-gray-700 hover:bg-gray-600 text-white font-medium py-3 rounded-lg transition">
                Se connecter avec Google
            </button>
        </a>

        <p class="text-center text-gray-400 mt-6">
            Pas encore de compte ?
            <a href="{% url 'account_signup' %}" class="text-accent hover:underline">S'inscrire</a>
        </p>

    </div>
</div>
{% endblock %}
