{% extends "base.html" %}
{% block title %}Déconnexion{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-panel border border-gray-700 shadow-lg rounded-xl p-8 max-w-md w-full text-center">

        <h1 class="text-2xl font-bold mb-4">Déconnexion</h1>
        <p class="text-gray-400 mb-6">Es-tu sûr de vouloir te déconnecter ?</p>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition">
                Se déconnecter
            </button>
        </form>

    </div>
</div>
{% endblock %}
